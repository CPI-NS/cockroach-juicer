# AWS EC2 Evaluation - Graph 8: Throughput vs Zipf (Bar Graph)
# ==============================================================================
#
# This configuration measures throughput across different Zipfian skew values.
# Uses the "knee" client count determined from Graph 7 (default: 9 clients × 8 workers = 72 total workers).
#
# Architecture:
#   - Same as Graph 7: 9 servers in us-east-1 (3 per AZ)
#   - Replication factor: 3
#   - 1M keyspace
#
# Workload:
#   - Read-Modify-Write (RMW) with 1 op/tx
#   - Varying Zipfian skew: 0.1, 0.4, 0.6, 0.8, 0.99, 1.2
#   - Fixed # of clients at "knee" (75-80% peak throughput)
#
# Output:
#   - X-axis: 6 discrete Zipf values
#   - Y-axis: System throughput (ops/sec)
#   - Bar graph: Baseline vs Juicer-enabled
# ==============================================================================

experiment:
  name: "aws-eval-graph8-throughput-zipf"
  output_dir: "../results/aws/graph8_throughput_zipf"
  repeat_count: 5
  timeout_seconds: 3600

  deployment_mode: "remote"

remote:
  ssh_user: "ubuntu"
  ssh_key: "~/.ssh/aws-juicer-key.pem"  # UPDATE THIS PATH
  ssh_host_base: ""

  nodes:
    servers:
      # Availability Zone: us-east-1a
      - hostname: "PLACEHOLDER_SERVER_0_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_0_PRIVATE_IP"
        role: "cockroach"
        node_id: 1
        availability_zone: "us-east-1a"

      - hostname: "PLACEHOLDER_SERVER_1_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_1_PRIVATE_IP"
        role: "cockroach"
        node_id: 2
        availability_zone: "us-east-1a"

      - hostname: "PLACEHOLDER_SERVER_2_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_2_PRIVATE_IP"
        role: "cockroach"
        node_id: 3
        availability_zone: "us-east-1a"

      # Availability Zone: us-east-1b
      - hostname: "PLACEHOLDER_SERVER_3_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_3_PRIVATE_IP"
        role: "cockroach"
        node_id: 4
        availability_zone: "us-east-1b"

      - hostname: "PLACEHOLDER_SERVER_4_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_4_PRIVATE_IP"
        role: "cockroach"
        node_id: 5
        availability_zone: "us-east-1b"

      - hostname: "PLACEHOLDER_SERVER_5_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_5_PRIVATE_IP"
        role: "cockroach"
        node_id: 6
        availability_zone: "us-east-1b"

      # Availability Zone: us-east-1c
      - hostname: "PLACEHOLDER_SERVER_6_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_6_PRIVATE_IP"
        role: "cockroach"
        node_id: 7
        availability_zone: "us-east-1c"

      - hostname: "PLACEHOLDER_SERVER_7_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_7_PRIVATE_IP"
        role: "cockroach"
        node_id: 8
        availability_zone: "us-east-1c"

      - hostname: "PLACEHOLDER_SERVER_8_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_8_PRIVATE_IP"
        role: "cockroach"
        node_id: 9
        availability_zone: "us-east-1c"

    clients:
      # Use 9 clients (adjust based on Graph 7 knee results)
      - hostname: "PLACEHOLDER_CLIENT_0_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_0_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_1_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_1_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_2_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_2_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_3_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_3_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_4_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_4_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_5_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_5_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_6_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_6_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_7_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_7_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_8_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_8_PRIVATE_IP"
        role: "benchmark"

  remote_paths:
    cockroach_bin: "/home/ubuntu/cockroach"
    benchmark_bin: "/home/ubuntu/benchmark"
    data_dir: "/mnt/data/cockroach-data"
    log_dir: "/mnt/data/logs"

  deploy_binaries: true
  local_build_dir: "../../cockroach-juicer/"

# Workload: Varying Zipfian skew
workload:
  tx_count: [50000]
  ops_per_tx: [1]
  key_range: [1000000]
  distribution: ["zipfian"]
  zipfian_s: [0.1, 0.4, 0.6, 0.8, 0.99, 1.2]  # 6 discrete Zipf values
  zipfian_v: [1.0]
  read_write_ratio: [0.0]  # 100% RMW

# Concurrency: Fixed at "knee" (UPDATE after Graph 7 results)
# Default: 9 clients × 8 workers = 72 total workers (75-80% peak)
concurrency:
  num_clients: [9]
  workers_per_client: [8]  # UPDATE this based on Graph 7 knee

# Juicer comparison
juicer:
  enabled: [false, true]
  flush_time_us: [100]

protocol:
  type: ["MVCC"]

cluster:
  num_nodes: 9
  base_port: 26257
  base_http_port: 8080
  store_size: "100GB"
  replication_factor: 3

data_init:
  enabled: true
  num_keys: 1000000
  key_prefix: "key"
  key_range: 1000000
  batch_size: 10000
  concurrent: 16
  use_bulk: true
  use_hash_keys: true
