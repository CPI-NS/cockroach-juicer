# AWS EC2 Evaluation - Graph 7: Finding the Knee (Latency vs Throughput)
# ==============================================================================
#
# This configuration finds the "knee" of the latency-throughput curve by varying
# the number of clients. The knee is defined as the point where the system runs
# at 75-80% of peak throughput.
#
# Architecture:
#   - 9 CockroachDB servers in single region (us-east-1)
#   - 3 servers per availability zone (us-east-1a, us-east-1b, us-east-1c)
#   - Replication factor: 3 (Raft fault tolerance)
#   - 1M keyspace, evenly sharded across 9 servers
#   - Variable # of clients: start with 9, increase to 18, 27, 36 to saturate
#
# Workload:
#   - Read-Modify-Write (RMW) transactions with 1 operation per transaction
#   - Zipfian distribution (zipf = 0.99) for high contention
#   - Hot keys evenly distributed via hash-based key generation
#
# Output:
#   - X-axis: Throughput (ops/sec)
#   - Y-axis: Median latency (ms)
#   - Line graph showing baseline vs Juicer-enabled
# ==============================================================================

experiment:
  name: "aws-eval-graph7-knee"
  output_dir: "../results/aws/graph7_knee"
  repeat_count: 5
  timeout_seconds: 3600  # 1 hour per run

  deployment_mode: "remote"

remote:
  ssh_user: "ubuntu"  # Default AWS EC2 Ubuntu user
  ssh_key: "~/.ssh/aws-juicer-key.pem"  # UPDATE THIS PATH
  ssh_host_base: ""  # Not used for AWS

  nodes:
    servers:
      # Availability Zone: us-east-1a
      - hostname: "PLACEHOLDER_SERVER_0_IP"  # UPDATE: Public IP of server-0
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_0_PRIVATE_IP"  # UPDATE: Private IP
        role: "cockroach"
        node_id: 1
        availability_zone: "us-east-1a"

      - hostname: "PLACEHOLDER_SERVER_1_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_1_PRIVATE_IP"
        role: "cockroach"
        node_id: 2
        availability_zone: "us-east-1a"

      - hostname: "PLACEHOLDER_SERVER_2_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_2_PRIVATE_IP"
        role: "cockroach"
        node_id: 3
        availability_zone: "us-east-1a"

      # Availability Zone: us-east-1b
      - hostname: "PLACEHOLDER_SERVER_3_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_3_PRIVATE_IP"
        role: "cockroach"
        node_id: 4
        availability_zone: "us-east-1b"

      - hostname: "PLACEHOLDER_SERVER_4_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_4_PRIVATE_IP"
        role: "cockroach"
        node_id: 5
        availability_zone: "us-east-1b"

      - hostname: "PLACEHOLDER_SERVER_5_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_5_PRIVATE_IP"
        role: "cockroach"
        node_id: 6
        availability_zone: "us-east-1b"

      # Availability Zone: us-east-1c
      - hostname: "PLACEHOLDER_SERVER_6_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_6_PRIVATE_IP"
        role: "cockroach"
        node_id: 7
        availability_zone: "us-east-1c"

      - hostname: "PLACEHOLDER_SERVER_7_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_7_PRIVATE_IP"
        role: "cockroach"
        node_id: 8
        availability_zone: "us-east-1c"

      - hostname: "PLACEHOLDER_SERVER_8_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_SERVER_8_PRIVATE_IP"
        role: "cockroach"
        node_id: 9
        availability_zone: "us-east-1c"

    clients:
      # Client nodes (start with 9, can scale to 18)
      - hostname: "PLACEHOLDER_CLIENT_0_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_0_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_1_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_1_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_2_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_2_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_3_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_3_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_4_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_4_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_5_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_5_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_6_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_6_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_7_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_7_PRIVATE_IP"
        role: "benchmark"

      - hostname: "PLACEHOLDER_CLIENT_8_IP"
        ssh_port: 22
        internal_ip: "PLACEHOLDER_CLIENT_8_PRIVATE_IP"
        role: "benchmark"

  remote_paths:
    cockroach_bin: "/home/ubuntu/cockroach"
    benchmark_bin: "/home/ubuntu/benchmark"
    data_dir: "/mnt/data/cockroach-data"  # Use EBS volume
    log_dir: "/mnt/data/logs"

  deploy_binaries: true
  local_build_dir: "../../cockroach-juicer/"

# Workload: Read-Modify-Write with Zipfian distribution
workload:
  tx_count: [50000]  # Sufficient transactions to reach steady state
  ops_per_tx: [1]  # RMW: single operation per transaction
  key_range: [1000000]  # 1M keyspace
  distribution: ["zipfian"]
  zipfian_s: [0.99]  # Default: high contention
  zipfian_v: [1.0]
  read_write_ratio: [0.0]  # 100% RMW (0% pure reads)

# Concurrency: Vary # of clients to find the knee
# Each client runs workers_per_client workers
# Total workers = num_clients * workers_per_client
concurrency:
  num_clients: [9]  # Use all 9 clients
  workers_per_client: [1, 2, 4, 8, 12, 16, 24, 32]  # Increase load progressively
  # This gives: 9, 18, 36, 72, 108, 144, 216, 288 total workers

# Juicer comparison: Baseline vs Juicer-enabled
juicer:
  enabled: [false, true]
  flush_time_us: [100]  # 100μs flush time for Juicer

# Protocol (metadata only for CockroachDB)
protocol:
  type: ["MVCC"]  # CockroachDB uses native MVCC

# Cluster configuration
cluster:
  num_nodes: 9
  base_port: 26257
  base_http_port: 8080
  store_size: "100GB"  # EBS volume size
  replication_factor: 3  # Raft fault tolerance

# Data initialization: 1M keys with hash-based distribution
data_init:
  enabled: true
  num_keys: 1000000  # 1M keyspace
  key_prefix: "key"
  key_range: 1000000
  batch_size: 10000
  concurrent: 16  # Parallel initialization
  use_bulk: true  # High-performance bulk insert
  use_hash_keys: true  # CRITICAL: Even distribution of hot keys across servers
