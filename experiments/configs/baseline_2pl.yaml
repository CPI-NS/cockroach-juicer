experiment:
  name: "baseline-2pl"
  output_dir: "../results/baseline"
  repeat_count: 3
  timeout_seconds: 300

workload:
  tx_count: [10000]
  ops_per_tx: [10]
  key_range: [100]
  distribution: ["uniform", "zipfian"]
  zipfian_s: [1.1]
  zipfian_v: [1.0]
  read_write_ratio: [0.5]

concurrency:
  num_clients: [1, 2, 4]
  workers_per_client: [10, 20]

juicer:
  enabled: [false]  # Baseline without Juicer
  flush_time_us: [100]  # Ignored when disabled

protocol:
  type: ["2PL", "2PL-WW"]

cluster:
  num_nodes: 1          # Number of CockroachDB nodes (1 for single-node, 3+ for multi-node)
  base_port: 26257      # Base SQL port (nodes use base_port, base_port+1, etc.)
  base_http_port: 8080  # Base HTTP port for admin UI
  data_dir: "./cockroach-data"
  log_dir: "./logs"
  store_size: "10GB"    # Maximum store size per node
