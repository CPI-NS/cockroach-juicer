# Graph 8: Throughput vs. Zipf (Bar Graph) - LOCAL VERSION
# Purpose: Show how contention (Zipf) affects system throughput
# Run locally with: python3 ./scripts/run_experiment.py config configs/eval_graph8_throughput_zipf_local.yaml

experiment:
  name: "local-eval-graph8-throughput-zipf"
  output_dir: "../results/eval_graph8_throughput_local"
  repeat_count: 2
  timeout_seconds: 300

# Workload: Read-Modify-Write transactions
workload:
  tx_count: [1000]          # Smaller for local
  ops_per_tx: [1]           # Single read-modify-write operation
  key_range: [10000]        # 10K keys
  distribution: ["zipfian"]
  zipfian_s: [0.1, 0.4, 0.6, 0.8, 0.99, 1.2]  # VARYING PARAMETER
  zipfian_v: [1.0]
  read_write_ratio: [0.0]   # 100% read-modify-write

# Client count: Use "knee" value from Graph 7
# TODO: After running Graph 7 local, update this with the knee value
# For now, using 16 as a reasonable guess
concurrency:
  num_clients: [1]
  workers_per_client: [16]  # UPDATE with knee value from Graph 7

# Juicer comparison
juicer:
  enabled: [false, true]
  flush_time_us: [100]

# Protocol
protocol:
  type: ["2PL-WW"]

# Cluster: 9 nodes running locally
cluster:
  num_nodes: 9
  base_port: 26257
  base_http_port: 8080
  data_dir: "./cockroach-data"
  log_dir: "./logs"
  store_size: "10GB"

# Data initialization
data_init:
  enabled: true
  num_keys: 10000
  key_prefix: "key"
  key_range: 10000
  batch_size: 1000
  concurrent: 4
  use_bulk: false
