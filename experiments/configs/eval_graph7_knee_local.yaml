# Graph 7: Median Latency vs. Throughput (Finding the Knee) - LOCAL VERSION
# Purpose: Identify system saturation point at 75-80% peak throughput
# Run locally with: python3 ./scripts/run_experiment.py config configs/eval_graph7_knee_local.yaml

experiment:
  name: "local-eval-graph7-knee"
  output_dir: "../results/eval_graph7_knee_local"
  repeat_count: 5           # 5 trials for stable statistics
  timeout_seconds: 600

# Workload: Read-Modify-Write transactions
workload:
  tx_count: [5000]          # 5K transactions for stable measurements
  ops_per_tx: [1]           # Single read-modify-write operation
  key_range: [10000]        # 10K keys (vs 10M on AWS)
  distribution: ["zipfian"]
  zipfian_s: [0.99]         # Default Zipf = 0.99
  zipfian_v: [1.0]
  read_write_ratio: [0.0]   # 100% read-modify-write

# Varying parameter: Number of clients (to find knee)
concurrency:
  num_clients: [1]
  workers_per_client: [1, 2, 4, 8, 16, 24]  # Reduced max to avoid extreme contention

# Juicer comparison
juicer:
  enabled: [false, true]    # Compare baseline vs Juicer
  flush_time_us: [100]

# Protocol
protocol:
  type: ["2PL-WW"]

# Cluster: 3 nodes for reduced resource contention on local machine
cluster:
  num_nodes: 3              # 3 nodes to reduce resource contention
  base_port: 26257          # Nodes will use 26257, 26258, 26259
  base_http_port: 8080      # HTTP ports: 8080, 8081, 8082
  data_dir: "./cockroach-data"
  log_dir: "./logs"
  store_size: "5GB"

# Data initialization: 10K keys
data_init:
  enabled: true
  num_keys: 10000           # Match key_range
  key_prefix: "key"
  key_range: 10000
  batch_size: 1000
  concurrent: 4
  use_bulk: false
